<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Group 3 – Slope-Intercept Cipher</title>
  <link href="https://fonts.googleapis.com/css?family=Orbitron&display=swap" rel="stylesheet">
  <style>
    body { background:#1a191b; color:#fff; font-family:'Orbitron', Arial, sans-serif; }
    .container { max-width:650px; margin:40px auto; background:#233140ee; border-radius:10px; padding:28px 28px 38px 28px; box-shadow:0 0 12px #252545; }
    .heading { font-size:1.7em; color:#b2e2ff; margin-bottom:20px; text-align:center; }
    .overlay { background:rgba(16, 16, 24, 0.89); padding:19px 24px; border-radius:8px; margin:0 auto; max-width:500px; box-shadow:0 2px 8px #18181844;}
    input[type="text"] { padding:8px; background:#232a39; color:#fff; border:1px solid #64aafc; border-radius:5px; width:90px; font-size:1em; text-align:center; margin-right: 6px;}
    #actionBtn { margin-top:14px; padding:6px 22px; background:#5577ff; color:#fff; border:none; border-radius:7px; cursor:pointer; font-size:1em;}
    #actionBtn:hover { background:#3355cc; }
    .math { font-family:'Consolas', monospace; color:#aaf; }
    .feedback { color:#6effc1; margin-top:14px; font-weight:bold; }
    .backlink { display:block; background:#353979; color:#fff; border-radius:8px; padding:9px; text-align:center; text-decoration:none; margin-top:32px; font-weight:700;}
    .backlink:hover {background:#2c334b;}
    ul { padding-left: 18px;}
  </style>
</head>
<body>
  <div class="container">
    <div class="heading"></div>
    <div class="overlay">
      <div class="clue"></div>
      <ul></ul>
      <button id="actionBtn">Unlock</button>
      <div class="feedback" id="feedback"></div>
    </div>
    <a href="task.html" class="backlink">← Back to Control Panel</a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const hourValue = localStorage.getItem("classHour") || "";
    const taskId = localStorage.getItem("currentTask") || "task1";
    const supabaseUrl = 'https://khazeoycsjdqnmwodncw.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoYXplb3ljc2pkcW5td29kbmN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5MDMwOTMsImV4cCI6MjA3ODQ3OTA5M30.h-WabaGcQZ968sO2ImetccUaRihRFmO2mUKCdPiAbEI';
    const client = supabase.createClient(supabaseUrl, supabaseKey);

    const TASKS = {
      task1: {
        heading: "Group 3: Slope-Intercept Cipher",
        clue: 'Write each equation below in <span class="math">y = mx + b</span> form.<br><span style="font-size:0.93em;color:#7fc6fe">Lower case, no spaces.</span>',
        button: "Unlock",
        equations: [
          { eq: "Slope: 5, y-intercept: -2", ans: "y=5x-2" },
          { eq: "y-intercept: 4, Slope: -1", ans: ["y=-1x+4", "y=-x+4"] },
          { eq: "Slope: 0.5, y-intercept: -1.4", ans: "y=0.5x-1.4" },
          { eq: "Slope: -2.1, y-intercept: -0.4", ans: "y=-2.1x-0.4" },
          { eq: "y-intercept: 1, Slope: 8/5", ans: "y=8/5x+1" }
        ]
      },
      task2: {
        heading: "Group 3: Equation Solution Counter",
        clue: `For each equation in x and y, decide:<br>
        <ul style="margin-top:6px">
          <li><strong>0</strong> no solution</li>
          <li><strong>1</strong> one solution</li>
          <li><strong>*</strong> infinitely many solutions</li>
        </ul>
        <span style="font-size:0.93em;color:#7fc6fe">Simplify each equation and determine its solution count.</span>`,
        button: "Solve",
        equations: [
          // Answer explanations included in comments
          { eq: "x + y = 2", ans: "*" },            // Infinite: line in xy-plane
          { eq: "0x + 0y = 7", ans: "0" },          // No solution: 0=7 contradiction
          { eq: "y - y = 0", ans: "*" },            // Infinite: always 0=0
          { eq: "2x + 3y = 2x + 4", ans: "1" },     // y = 4/3, only one value for y (x cancels out)
          { eq: "5x - 2y = 5x + 6", ans: "1" }      // y = -3, only one value for y (x cancels out)
        ]
      },
      task3: {
        heading: "Group 3: Hull Repair Coordination (Dorsal Array)",
        clue: 'Solve each system of equations to find the intersection point (x, y). Type the answer as x,y in each box.<br><span style="font-size:0.95em;color:#7fc6fe">(Example: for x=2, y=5, enter 2,5)</span>',
        button: "Repair",
        equations: [
          { eq: "System 1:<br>y = 2x + 5<br>y = -x - 1", ans: " -2,1" },
          { eq: "System 2:<br>y = x + 3<br>y = 4x - 6", ans: "3,6" },
          { eq: "System 3:<br>y = 0.5x - 2<br>y = -x + 4", ans: "4,0" },
          { eq: "System 4:<br>2x - 3y = -1<br>x + y = 5", ans: "2,3" },
          { eq: "System 5:<br>x - 2y = 1<br>3x + y = 14", ans: "4,5" }
        ]
      }
    };

    function renderTaskContent() {
      const task = TASKS[taskId] || TASKS["task1"];
      document.querySelector('.heading').textContent = task.heading;
      document.querySelector('.clue').innerHTML = "<strong>Clue:</strong> " + task.clue;
      document.getElementById("actionBtn").textContent = task.button;

      const ul = document.querySelector('ul');
      ul.innerHTML = "";
      task.equations.forEach((e, i) => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="math">${e.eq}</span> &rarr; <input type="text" id="ans${i+1}" maxlength="20">`;
        ul.appendChild(li);
      });
    }

    async function checkCompleted() {
      try {
        let { data, error } = await client
          .from('airlock_status')
          .select('done')
          .eq('group', 'group3')
          .eq('hour', hourValue)
          .eq('task', taskId)
          .maybeSingle();
        if (data && data.done) {
          document.getElementById("feedback").textContent = "Already unlocked! Return to the Control Panel.";
          document.getElementById("actionBtn").disabled = true;
        } else {
          document.getElementById("feedback").textContent = "";
          document.getElementById("actionBtn").disabled = false;
        }
        if (error && error.code !== "PGRST116") {
          document.getElementById("feedback").textContent = "Supabase error (on load): " + error.message;
          console.error("Supabase error (on load):", error);
        }
      } catch (err) {
        document.getElementById("feedback").textContent = "JS Error (on load): " + err;
        console.error("JS Error (on load):", err);
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      renderTaskContent();
      checkCompleted();
    });

    document.getElementById("actionBtn").onclick = async function() {
      const task = TASKS[taskId] || TASKS["task1"];
      let correct = true;

      task.equations.forEach((e, i) => {
        let answer = document.getElementById("ans"+(i+1)).value.trim();
        if (taskId === "task3") {
          // For intersection, strip spaces and parentheses (accept negative zero as "-0")
          answer = answer.replace(/\s+/g, '').replace(/[()]/g, '').replace(/^-0,/, '0,').replace(/,0$/, ',0');
        } else {
          answer = answer.replace(/\s+/g, '').toLowerCase();
        }
        let target;
        if (Array.isArray(e.ans)) {
          target = e.ans.map(s => s.replace(/\s+/g,'').toLowerCase());
          if (!target.includes(answer.toLowerCase())) correct = false;
        } else {
          target = e.ans.replace(/\s+/g, '');
          if (answer.toLowerCase() !== target.toLowerCase()) correct = false;
        }
      });

      if (correct) {
        document.getElementById("feedback").textContent = "Correct! Segment unlocked. Return to the Control Panel.";
        document.getElementById("actionBtn").disabled = true;
        try {
          const { error, data } = await client
            .from('airlock_status')
            .upsert([{ group: 'group3', task: taskId, done: true, hour: hourValue }]);
          if (error) {
            document.getElementById("feedback").textContent += "\nError: " + error.message;
            console.error("Supabase error:", error);
          } else {
            console.log("Supabase upsert OK", data);
          }
        } catch (err) {
          document.getElementById("feedback").textContent += "\nJS Error: " + err;
          console.error("JS Error:", err);
        }
      } else {
        document.getElementById("feedback").textContent = "Try again.";
      }
    };
  </script>
</body>
</html>
