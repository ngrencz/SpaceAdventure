<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Outpost Status Panel</title>
  <link href="https://fonts.googleapis.com/css?family=Orbitron&display=swap" rel="stylesheet">
  <style>
    body {
      background: #101130;
      color: #bfefff;
      font-family: 'Orbitron', Arial, sans-serif;
      text-align: center;
    }
    h1 {
      font-size: 2.1em;
      color: #51cfff;
      margin-top: 28px;
      margin-bottom: 44px;
      text-shadow: 0 2px 18px #1388d8;
    }
    .hourbar {
      width: 420px;
      height: 44px;
      font-size: 1.25em;
      margin: 0 auto 18px auto;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      letter-spacing: 2px;
      box-shadow: 0 0 14px #222;
      color: #fff;
      transition: background 0.25s, color 0.15s, box-shadow 0.25s;
      position: relative;
    }
    .hourbar.red {
      background: #cc2530;
      color: #fffbe9;
      box-shadow: 0 0 28px #fd4a4a, 0 0 12px #660f19;
    }
    .hourbar.orange {
      background: #cc7000;
      color: #fff2e6;
      box-shadow: 0 0 36px #ffb54a, 0 0 12px #7a3c00;
    }
    .hourbar.yellow {
      background: #ffe035;
      color: #2a2a2a;
      box-shadow: 0 0 32px #fff57a, 0 0 10px #d2ba0a;
    }
    .hourbar.green {
      background: #23d75a;
      color: #fff;
      box-shadow: 0 0 44px #33ff99, 0 0 14px #16a064;
    }
    .hourbar.pulse {
      animation: pulsebar 1.4s 2;
    }
    @keyframes pulsebar {
      0%   { }
      20%  { box-shadow: 0 0 38px #fd4a4a, 0 0 18px #660f19; }
      40%  { box-shadow: 0 0 52px #ffb54a, 0 0 22px #7a3c00; }
      60%  { box-shadow: 0 0 56px #fff57a, 0 0 16px #e2df45; }
      80%  { box-shadow: 0 0 48px #33ff99, 0 0 20px #16a064; }
      100% { }
    }
    .status-panel {
      display: flex;
      justify-content: center;
      gap: 34px;
      margin-top: 18px;
      margin-bottom:18px;
    }
    .segment {
      border-radius: 18px;
      width: 120px;
      height: 120px;
      background: #283358;
      border: 3px solid #385b81;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.3em;
      color: #aecffc;
      box-shadow: 0 0 40px #2af;
      transition: background 0.18s, color 0.18s, border 0.18s, box-shadow 0.18s;
      position: relative;
    }
    .segment.done {
      background: #33da92;
      color: #f7fff8;
      border: 3px solid #7afdff;
      box-shadow: 0 0 50px #13ffa0, 0 0 14px #23d75a;
    }
    .segment.done.pulse {
      animation: pulse 1s 2;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 50px #13ffa080; }
      25%  { box-shadow: 0 0 120px #48ffb5, 0 0 20px #54ffb0;}
      75%  { box-shadow: 0 0 100px #13ffa040, 0 0 18px #23d75a; }
      100% { box-shadow: 0 0 50px #13ffa080; background: #33da92;}
    }
    .clue-panel {
      display: none;
      margin: 30px auto 0 auto;
      max-width: 560px;
      background: #202c44;
      border-radius: 15px;
      padding: 24px 14px 20px 14px;
      box-shadow: 0 0 32px #17adfc22, 0 2px 28px #20bb7f22;
    }
    .clue-title {
      color:#53ffaa; 
      font-size:1.14em; 
      margin-bottom:12px; 
      text-shadow:0 2px 14px #1b9b7b44;
    }
    .clue-text-list {
      font-size:1.07em; 
      color:#aefcca; 
      letter-spacing: 1.5px;
    }
    .loc-final {
      font-size: 1.23em;
      color: #7cdcf8;
      margin-top: 30px;
      font-weight: bold;
    }
    .overlay-wrap {
      display: none;
      position: fixed;
      left: 0; top: 0; width: 100%; height: 100%;
      background: #101130d8;
      z-index: 1000;
      justify-content: center; align-items: center;
    }
    .overlay-content {
      padding: 56px 40px;
      background: #244b7c;
      border-radius: 22px;
      color: #cbefff;
      font-size: 2.35em;
      font-weight: bold;
      box-shadow: 0 0 90px #16a098, 0 0 16px #233357;
      text-shadow: 0 6px 30px #17b7fd77;
      animation: accessFade 1.2s;
    }
    @keyframes accessFade {
      0%   { opacity: 0;}
      100% { opacity:1;}
    }
    .reset-btn {
      display: inline-block;
      margin-top: 64px;
      padding: 8px 26px;
      background: #264d7c;
      color: #fff;
      font-size: 1.1em;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 2px 20px #195fb933;
      transition: background 0.16s;
    }
    .reset-btn:hover { background: #133360; }
  </style>
</head>
<body>
  <h1 id="mainTitle">Outpost IX Airlock<br>Status Panel</h1>
  <div id="hourbar" class="hourbar red">Hour: (none selected)</div>
  <div class="status-panel">
    <div class="segment" id="stat1">Group 1</div>
    <div class="segment" id="stat2">Group 2</div>
    <div class="segment" id="stat3">Group 3</div>
    <div class="segment" id="stat4">Group 4</div>
    <div class="segment" id="stat5">Group 5</div>
  </div>

  <!-- CLUE Panel (hidden until clues start) -->
  <div id="cluePanel" class="clue-panel">
    <div class="clue-title">Clues Revealed:</div>
    <div id="clueList" class="clue-text-list"></div>
  </div>

  <div id="locFinal" class="loc-final"></div>
  <button class="reset-btn" onclick="resetStatus()">Reset Status</button>

  <div class="overlay-wrap" id="overlayAccess">
    <div class="overlay-content" id="accessText"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    let overlayPersist = false; 
    // Group clues (customize as desired!)
    const CLUES = [
      "Aft Section",      // Group 1
      "Starboard Side",   // Group 2
      "Lower Decks",      // Group 3
      "Deck 3",           // Group 4
      "Compartment #17"   // Group 5
    ];
    const GROUP_LABELS = ["Group 1", "Group 2", "Group 3", "Group 4", "Group 5"];

    let previousColor = "", hourValue = localStorage.getItem("classHour") || "";
    const supabaseUrl = 'https://khazeoycsjdqnmwodncw.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoYXplb3ljc2pkcW5td29kbmN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5MDMwOTMsImV4cCI6MjA3ODQ3OTA5M30.h-WabaGcQZ968sO2ImetccUaRihRFmO2mUKCdPiAbEI';
    const client = supabase.createClient(supabaseUrl, supabaseKey);
    let currentTask = "task1";
    let cluesShown = [];

    async function showStatus() {
      // Query group status for this hour/task
      const { data, error } = await client
        .from('airlock_status')
        .select('group,done,task')
        .eq('hour', hourValue)
        .eq('task', currentTask);

      cluesShown = [];
      let doneCount = 0;
      for (let i = 1; i <= 5; i++) {
        const el = document.getElementById("stat" + i);
        const groupName = "group" + i;
        el.classList.remove('done', 'pulse');
        let groupData = data?.find(d => d.group === groupName);
        if(groupData && groupData.done){
          el.classList.add('done');
          el.innerHTML = GROUP_LABELS[i-1] + "<br>✓";
          // Reveal clue for this group only if currentTask is a clue-giving task
          if(["task2","task3"].includes(currentTask)){
            cluesShown.push(`${GROUP_LABELS[i-1]}: ${CLUES[i-1]}`);
          }
          doneCount++;
        } else {
          el.innerHTML = GROUP_LABELS[i-1];
        }
      }
      // -- CLUE PANEL logic --
      const cluePanel = document.getElementById("cluePanel");
      const clueList = document.getElementById("clueList");
      if (cluesShown.length > 0) {
        cluePanel.style.display = "block";
        clueList.innerHTML = cluesShown.join("<br>");
        // Show assemble location when all 5 clues are revealed
        if (cluesShown.length === 5) {
          clueList.innerHTML += `<br><br><span style="font-size:1.17em; color:#43e6ef; font-weight:bold;">LOCATION: ${CLUES.join(" – ")}</span>`;
        }
      } else {
        cluePanel.style.display = "none";
        clueList.innerHTML = "";
      }

      // Bar color and info
      const bar = document.getElementById("hourbar");
      let colorClass = "red";
      if (doneCount >= 5) colorClass = "green";
      else if (doneCount >= 3) colorClass = "yellow";
      else if (doneCount >= 1) colorClass = "orange";
      bar.classList.remove("red", "orange", "yellow", "green", "pulse");
      bar.classList.add(colorClass);
      bar.innerHTML = `Hour: ${hourValue ? hourValue : "(none selected)"} <span style="font-weight:normal;font-size:0.98em;margin-left:12px;">(${doneCount}/5 groups complete)</span>`;
      if (previousColor !== colorClass) {
        bar.classList.add("pulse");
        setTimeout(() => bar.classList.remove("pulse"), 2800);
        previousColor = colorClass;
      }

      // All done logic and overlays
      const overlay = document.getElementById("overlayAccess");
      const accessText = document.getElementById("accessText");
      if (doneCount === 5) {
        if(currentTask === "task1"){
          overlay.style.display = "flex";
          overlayPersist = true;
          accessText.innerHTML = "Access Granted!<br>All security segments unlocked.<br><br>";
          setTimeout(() => {
            overlay.style.display = "none";
            overlayPersist = false;
            switchToTask2();
          }, 10000); // After overlay, go to next task
        } else if(currentTask === "task2"){
          overlay.style.display = "flex";
          overlayPersist = true;
          accessText.innerHTML = "<span style='font-size:1.14em;color:#f7fc7e;'>Damage Located!</span><br><br>";
          for(let i=0; i < CLUES.length; i++){
            accessText.innerHTML += `<span style="font-size:0.95em;color:#84ffc5;">${GROUP_LABELS[i]}: ${CLUES[i]}</span><br>`;
          }
          accessText.innerHTML += `<br><span style="font-size:1.1em;color:#56d1e7;font-weight:bold;">LOCATION: ${CLUES.join(" – ")}</span>`;
          setTimeout(() => {
            overlay.style.display = "none";
            overlayPersist = false;
          }, 10000);
        }
      } else {
        if (!overlayPersist) {
          overlay.style.display = "none";
        }
      }
    }

    function switchToTask2(){
      currentTask = "task2";
      cluesShown = [];
      document.getElementById("mainTitle").innerHTML = "Outpost IX Damage Panel<br>Task 2";
      document.getElementById("hourbar").classList.remove("pulse", "green", "orange", "yellow", "red");
      // Reset clue panel
      document.getElementById("cluePanel").style.display = "none";
      document.getElementById("clueList").innerHTML = "";
    }

    setInterval(showStatus, 1500);
    showStatus();

    // Pulse group segments every 5 seconds
    setInterval(() => {
      document.querySelectorAll('.segment.done').forEach(el => {
        el.classList.remove('pulse');
        void el.offsetWidth;
        el.classList.add('pulse');
        setTimeout(() => el.classList.remove('pulse'), 2000);
      });
    }, 5000);

    async function resetStatus() {
      try {
        await client
          .from('airlock_status')
          .delete()
          .eq('hour', hourValue); // only clear for current hour!
        setTimeout(showStatus, 1000);
        currentTask = "task1";
        document.getElementById("mainTitle").innerHTML = "Outpost IX Airlock<br>Status Panel";
        document.getElementById("cluePanel").style.display = "none";
        document.getElementById("clueList").innerHTML = "";
      } catch (err) {
        console.error("Reset JS Error:", err);
      }
    }
  </script>
</body>
</html>
