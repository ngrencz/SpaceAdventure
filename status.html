<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Outpost Status Panel</title>
  <link href="https://fonts.googleapis.com/css?family=Orbitron&display=swap" rel="stylesheet">
  <style>
    body {
      background: #101130;
      color: #bfefff;
      font-family: 'Orbitron', Arial, sans-serif;
      text-align: center;
    }
    h1 {
      font-size: 2.1em;
      color: #51cfff;
      margin-top: 28px;
      margin-bottom: 44px;
      text-shadow: 0 2px 18px #1388d8;
    }
    .status-panel {
      display: flex;
      justify-content: center;
      gap: 34px;
      margin-top: 50px;
    }
    .segment {
      border-radius: 18px;
      width: 120px;
      height: 120px;
      background: #283358;
      border: 3px solid #385b81;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.3em;
      color: #aecffc;
      box-shadow: 0 0 40px #2af;
      transition: background 0.18s, color 0.18s, border 0.18s;
    }
    .segment.done {
      background: #33da92;
      color: #f7fff8;
      border: 3px solid #7afdff;
      box-shadow: 0 0 50px #13ffa0;
      /* NO animation by default; JS will toggle .pulse for effect */
    }
    .segment.done.pulse {
      animation: pulse 1s 2;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 50px #13ffa080; }
      25%  { box-shadow: 0 0 120px #13ffa040; background: #48ffb5; color: #ffffff;}
      75%  { box-shadow: 0 0 100px #13ffa040; }
      100% { box-shadow: 0 0 50px #13ffa080; background: #33da92; color: #f7fff8; }
    }
    .reset-btn {
      display: inline-block;
      margin-top: 64px;
      padding: 8px 26px;
      background: #264d7c;
      color: #fff;
      font-size: 1.1em;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 2px 20px #195fb933;
      transition: background 0.16s;
    }
    .reset-btn:hover { background: #133360; }
  </style>
</head>
<body>
  <h1>Outpost IX Airlock<br>Status Panel</h1>
  <div class="status-panel">
    <div class="segment" id="stat1">Group 1</div>
    <div class="segment" id="stat2">Group 2</div>
    <div class="segment" id="stat3">Group 3</div>
    <div class="segment" id="stat4">Group 4</div>
    <div class="segment" id="stat5">Group 5</div>
  </div>
  <button class="reset-btn" onclick="resetStatus()">Reset Status</button>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://khazeoycsjdqnmwodncw.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoYXplb3ljc2pkcW5td29kbmN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5MDMwOTMsImV4cCI6MjA3ODQ3OTA5M30.h-WabaGcQZ968sO2ImetccUaRihRFmO2mUKCdPiAbEI';
    const client = supabase.createClient(supabaseUrl, supabaseKey);

    async function showStatus() {
      try {
        // Query all group statuses from Supabase
        const { data, error } = await client
          .from('airlock_status')
          .select('group,done');
        if (error) {
          console.error("Supabase error:", error);
        }
        // For each group 1–5, update display
        for (let i = 1; i <= 5; i++) {
          const el = document.getElementById("stat" + i);
          const groupName = "group" + i;
          const groupData = data?.find(d => d.group === groupName);
          if (groupData && groupData.done) {
            el.classList.add('done');
            el.innerText = "Group " + i + "\n✓";
          } else {
            el.classList.remove('done', 'pulse');
            el.innerText = "Group " + i;
          }
        }

        // **Trigger pulse immediately for current done groups (first load and after reset)**
        document.querySelectorAll('.segment.done').forEach(el => {
          el.classList.remove('pulse');
          // Force reflow and pulse
          void el.offsetWidth; // triggers reflow so animation restarts!
          el.classList.add('pulse');
          setTimeout(() => el.classList.remove('pulse'), 2000);
        });
      } catch (err) {
        console.error("JS Error:", err);
      }
    }
    setInterval(showStatus, 1500);
    showStatus();

    // Repeat pulses every 5 seconds
    setInterval(() => {
      document.querySelectorAll('.segment.done').forEach(el => {
        el.classList.remove('pulse');
        void el.offsetWidth; // force reflow
        el.classList.add('pulse');
        setTimeout(() => el.classList.remove('pulse'), 2000);
      });
    }, 5000);

    async function resetStatus() {
      try {
        await client
          .from('airlock_status')
          .delete()
          .neq('group', ''); // delete all rows
        setTimeout(showStatus, 1000);
      } catch (err) {
        console.error("Reset JS Error:", err);
      }
    }
  </script>
</body>
</html>
