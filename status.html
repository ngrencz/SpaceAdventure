<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Outpost Status Panel</title>
  <link href="https://fonts.googleapis.com/css?family=Orbitron&display=swap" rel="stylesheet">
  <style>
    body { background: #101130; color: #bfefff; font-family: 'Orbitron', Arial, sans-serif; text-align: center;}
    h1 { font-size: 2.1em; color: #51cfff; margin-top: 28px; margin-bottom: 44px; text-shadow: 0 2px 18px #1388d8;}
    .hourbar {
      width: 420px; height: 44px; font-size: 1.25em; margin: 0 auto 18px auto; border-radius: 22px;
      display: flex; align-items: center; justify-content: center; font-weight: bold; letter-spacing: 2px;
      box-shadow: 0 0 14px #222; color: #fff; transition: background 0.25s, color 0.15s, box-shadow 0.25s; position: relative;
    }
    .hourbar.red { background: #cc2530; color: #fffbe9; box-shadow: 0 0 28px #fd4a4a, 0 0 12px #660f19;}
    .hourbar.orange { background: #cc7000; color: #fff2e6; box-shadow: 0 0 36px #ffb54a, 0 0 12px #7a3c00;}
    .hourbar.yellow { background: #ffe035; color: #2a2a2a; box-shadow: 0 0 32px #fff57a, 0 0 10px #d2ba0a;}
    .hourbar.green { background: #23d75a; color: #fff; box-shadow: 0 0 44px #33ff99, 0 0 14px #16a064;}
    .hourbar.blue { background: #225daf; color: #fffbea; box-shadow: 0 0 44px #448cff, 0 0 14px #163393;}
    .hourbar.pulse { animation: pulsebar 1.4s 2;}
    @keyframes pulsebar { 0%{} 20%{box-shadow:0 0 38px #fd4a4a,0 0 18px #660f19;} 40%{box-shadow:0 0 52px #ffb54a,0 0 22px #7a3c00;} 60%{box-shadow:0 0 56px #fff57a,0 0 16px #e2df45;} 80%{box-shadow:0 0 48px #33ff99,0 0 20px #16a064;} 100%{} }
    .status-panel { display: flex; justify-content: center; gap: 34px; margin-top: 18px; margin-bottom:18px;}
    .segment {
      border-radius: 18px; width: 120px; height: 120px; background: #283358; border: 3px solid #385b81;
      display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.3em;
      color: #aecffc; box-shadow: 0 0 40px #2af; transition: background 0.18s, color 0.18s, border 0.18s, box-shadow 0.18s;
      position: relative;
    }
    .segment.done { background: #33da92; color: #f7fff8; border: 3px solid #7afdff; box-shadow: 0 0 50px #13ffa0, 0 0 14px #23d75a;}
    .segment.repair { background: #225daf; color: #eaf5ff; border: 3px solid #7caefd; box-shadow: 0 0 48px #448cff, 0 0 13px #225daf;}
    .segment.done.pulse { animation: pulse 1s 2;}
    @keyframes pulse {
      0%{box-shadow:0 0 50px #13ffa080;}
      25%{box-shadow:0 0 120px #48ffb5,0 0 20px #54ffb0;}
      75%{box-shadow:0 0 100px #13ffa040,0 0 18px #23d75a;}
      100%{box-shadow:0 0 50px #13ffa080; background:#33da92;}
    }
    .clue-panel, .hull-panel {
      display: none;
      margin: 30px auto 0 auto;
      max-width: 560px;
      background: #202c44;
      border-radius: 15px;
      padding: 24px 14px 20px 14px;
      box-shadow: 0 0 32px #17adfc22, 0 2px 28px #20bb7f22;
    }
    .clue-title, .hull-title { color:#53ffaa; font-size:1.14em; margin-bottom:12px; text-shadow:0 2px 14px #1b9b7b44; }
    .clue-text-list, .hull-list { font-size:1.07em; color:#aefcca; letter-spacing: 1.5px;}
    .loc-final, .hull-final { font-size: 1.23em; color: #7cdcf8; margin-top: 30px; font-weight: bold;}
    .overlay-wrap {
      display: none;
      position: fixed;
      left: 0; top: 0; width: 100%; height: 100%;
      background: #101130d8;
      z-index: 1000;
      justify-content: center; align-items: center;
    }
    .overlay-content {
      padding: 56px 40px;
      background: #244b7c;
      border-radius: 22px;
      color: #cbefff;
      font-size: 2.35em;
      font-weight: bold;
      box-shadow: 0 0 90px #16a098, 0 0 16px #233357;
      text-shadow: 0 6px 30px #17b7fd77;
      animation: accessFade 1.2s;
    }
    @keyframes accessFade { 0% { opacity: 0;} 100% { opacity:1;} }
    .reset-btn {
      display: inline-block;
      margin-top: 64px;
      padding: 8px 26px;
      background: #264d7c;
      color: #fff;
      font-size: 1.1em;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 2px 20px #195fb933;
      transition: background 0.16s;
    }
    .reset-btn:hover { background: #133360; }
  </style>
</head>
<body>
  <h1 id="mainTitle">Outpost IX Airlock<br>Status Panel</h1>
  <div id="hourbar" class="hourbar red">Hour: (none selected)</div>
  <div class="status-panel">
    <div class="segment" id="stat1">Group 1</div>
    <div class="segment" id="stat2">Group 2</div>
    <div class="segment" id="stat3">Group 3</div>
    <div class="segment" id="stat4">Group 4</div>
    <div class="segment" id="stat5">Group 5</div>
  </div>
  <div id="cluePanel" class="clue-panel">
    <div class="clue-title">Clues Revealed:</div>
    <div id="clueList" class="clue-text-list"></div>
  </div>
  <div id="hullPanel" class="hull-panel">
    <div class="hull-title">Hull Repair Progress:</div>
    <div id="hullList" class="hull-list"></div>
    <div id="hullFinal" class="hull-final"></div>
  </div>
  <button class="reset-btn" onclick="resetStatus()">Reset Status</button>
  <div class="overlay-wrap" id="overlayAccess">
    <div class="overlay-content" id="accessText"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Config
    const REPAIR_ZONES = [
      "Compartments 17-40 on Decks 3-6",     // Group 1
      "Compartments 17-40 on Decks 7-10",    // Group 2
      "Compartments 17-40 on Decks 11-14",   // Group 3
      "Compartments 17-40 on Decks 15–17",   // Group 4
      "Compartments 41–48 on Decks 3-17"     // Group 5
    ];
    const CLUES = [
      "Aft Section",      // Group 1
      "Starboard Side",   // Group 2
      "Lower Decks",      // Group 3
      "Decks 3–17",       // Group 4
      "Compartments #17–48" // Group 5
    ];
    const GROUP_LABELS = [
      "Group 1",
      "Group 2",
      "Group 3",
      "Group 4",
      "Group 5"
    ];

    // Type switching
    const CLUE_TASKS = ["task2"];
    const HULL_TASKS = ["task3"];
    let overlayPersist = false;
    let lastOverlayTaskHour = null;
    let lastOverlayTaskShown = null;
    let previousColor = "";
    let hourValue = localStorage.getItem("classHour") || "";
    let currentTask = localStorage.getItem("currentTask") || "task1"; // Use localStorage!

    const supabaseUrl = 'https://khazeoycsjdqnmwodncw.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoYXplb3ljc2pkcW5td29kbmN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5MDMwOTMsImV4cCI6MjA3ODQ3OTA5M30.h-WabaGcQZ968sO2ImetccUaRihRFmO2mUKCdPiAbEI';
    const client = supabase.createClient(supabaseUrl, supabaseKey);

    let cluesShown = [];
    let hullShown = [];

    // Robust overlay handler (unchanged)
    function updateOverlay(show, html, persistForMs) {
      const overlay = document.getElementById("overlayAccess");
      const accessText = document.getElementById("accessText");
      if (show) {
        overlay.style.display = "flex";
        accessText.innerHTML = html;
        overlayPersist = true;
        if (persistForMs > 0) {
          setTimeout(() => {
            overlay.style.display = "none";
            overlayPersist = false;
          }, persistForMs);
        }
      } else {
        overlay.style.display = "none";
        overlayPersist = false;
      }
    }

    async function showStatus() {
      // re-read the currentTask in case it changes
      currentTask = localStorage.getItem("currentTask") || "task1";
      // Query only for the locally-selected task
      const { data, error } = await client
        .from('airlock_status')
        .select('group,done,task')
        .eq('hour', hourValue)
        .eq('task', currentTask);

      cluesShown = [];
      hullShown = [];
      let doneCount = 0;
      for (let i = 1; i <= 5; i++) {
        const el = document.getElementById("stat" + i);
        const groupName = "group" + i;
        el.classList.remove('done', 'pulse', 'repair');
        let groupData = data?.find(d => d.group === groupName);
        if(groupData && groupData.done){
          doneCount++;
          if (HULL_TASKS.includes(currentTask)) {
            el.classList.add('done', 'repair');
            el.innerHTML = `${GROUP_LABELS[i-1]}<br>✓<br><span style="font-size:0.93em;color:#b5f7ff;">${REPAIR_ZONES[i-1]}</span>`;
            hullShown.push(`<strong>${GROUP_LABELS[i-1]}:</strong> ${REPAIR_ZONES[i-1]} <span style="color:#83daff;">- Repaired</span>`);
          }
          else {
            el.classList.add('done');
            el.innerHTML = GROUP_LABELS[i-1] + "<br>✓";
            if(CLUE_TASKS.includes(currentTask)){
              cluesShown.push(`${GROUP_LABELS[i-1]}: ${CLUES[i-1]}`);
            }
          }
        } else {
          el.innerHTML = GROUP_LABELS[i-1];
        }
      }

      // PANEL swap logic
      const cluePanel = document.getElementById("cluePanel");
      const clueList = document.getElementById("clueList");
      const hullPanel = document.getElementById("hullPanel");
      const hullList = document.getElementById("hullList");
      const hullFinal = document.getElementById("hullFinal");

      cluePanel.style.display = "none";
      hullPanel.style.display = "none";
      clueList.innerHTML = "";
      hullList.innerHTML = "";
      hullFinal.innerHTML = "";

      if (CLUE_TASKS.includes(currentTask) && cluesShown.length > 0) {
        cluePanel.style.display = "block";
        clueList.innerHTML = cluesShown.join("<br>");
        if (cluesShown.length === 5) {
          clueList.innerHTML += `<br><br><span style="font-size:1.16em; color:#43e6ef; font-weight:bold;">LOCATION: ${CLUES.join(" – ")}</span>`;
        }
      }
      else if (HULL_TASKS.includes(currentTask)) {
        hullPanel.style.display = "block";
        hullList.innerHTML = hullShown.join("<br>");
        if (hullShown.length === 5) {
          hullFinal.innerHTML = `<span style="font-size:1.19em; color:#86ffe2; font-weight:bold;">
            Hull Integrity: <span style="color:#44acff;">REPAIRED</span><br>
            <span style="font-size:0.98em;color:#cdfcff;font-weight:normal;">Survival odds improved.<br>
            Stand by for oxygen system reactivation module...</span>
          </span>`;
        } else {
          hullFinal.innerHTML = `<span style="font-size:1.09em; color:#63e8ef; font-weight:bold;">Hull Repairs Pending...</span>`;
        }
      }

      // Bar color/status logic
      const bar = document.getElementById("hourbar");
      let colorClass = "red";
      if (HULL_TASKS.includes(currentTask)) colorClass = "blue";
      else if (doneCount >= 5 && CLUE_TASKS.includes(currentTask)) colorClass = "green";
      else if (doneCount >= 3) colorClass = "yellow";
      else if (doneCount >= 1) colorClass = "orange";

      bar.className = `hourbar ${colorClass}`;
      if (HULL_TASKS.includes(currentTask)) {
        bar.innerHTML = `Hour: ${hourValue ? hourValue : "(none selected)"} <span style="font-weight:normal;font-size:0.98em;margin-left:12px;">(Hull Repair: ${doneCount}/5 complete)</span>`;
      } else {
        bar.innerHTML = `Hour: ${hourValue ? hourValue : "(none selected)"} <span style="font-weight:normal;font-size:0.98em;margin-left:12px;">(${doneCount}/5 groups complete)</span>`;
      }
      if (previousColor !== colorClass) {
        bar.classList.add("pulse");
        setTimeout(() => bar.classList.remove("pulse"), 2800);
        previousColor = colorClass;
      }

      // OVERLAY logic: only show ONCE per completed task per hour
      if (doneCount === 5 && !overlayPersist && (lastOverlayTaskHour !== hourValue || lastOverlayTaskShown !== currentTask)) {
        overlayPersist = true;
        lastOverlayTaskHour = hourValue;
        lastOverlayTaskShown = currentTask;
        if(currentTask === "task1"){
          updateOverlay(
            true,
            "Access Granted!<br>All security segments unlocked.<br><br>",
            10000
          );
          setTimeout(() => {
            document.getElementById("mainTitle").innerHTML = "Outpost IX Damage Panel<br>Task 2";
            overlayPersist = false;
          }, 10000);
        } else if(CLUE_TASKS.includes(currentTask)){
          let cluesHtml = "<span style='font-size:1.14em;color:#f7fc7e;'>Damage Located!</span><br><br>";
          for(let i=0; i < CLUES.length; i++){
            cluesHtml += `<span style="font-size:0.95em;color:#84ffc5;">${GROUP_LABELS[i]}: ${CLUES[i]}</span><br>`;
          }
          cluesHtml += `<br><span style="font-size:1.1em;color:#56d1e7;font-weight:bold;">LOCATION: ${CLUES.join(" – ")}</span>`;
          updateOverlay(true, cluesHtml, 10000);
          setTimeout(() => {
            overlayPersist = false;
          }, 10000);
        } else if(HULL_TASKS.includes(currentTask)){
          updateOverlay(
            true,
            "<span style='color:#acecff;'>Hull Repair Sequence Complete!</span><br><br>All critical sectors restored.<br>Survival odds improved.<br><span style='font-size:0.7em;color:#c7ffdc;'>Next Module Activation: Oxygen System…</span>",
            11000
          );
          setTimeout(() => {
            overlayPersist = false;
          }, 11000);
        }
      }
      if ((doneCount < 5) && !overlayPersist) {
        updateOverlay(false);
      }
    }

    setInterval(showStatus, 1500);
    showStatus();

    setInterval(() => {
      document.querySelectorAll('.segment.done').forEach(el => {
        el.classList.remove('pulse');
        void el.offsetWidth;
        el.classList.add('pulse');
        setTimeout(() => el.classList.remove('pulse'), 2000);
      });
    }, 5000);

    async function resetStatus() {
      try {
        await client
          .from('airlock_status')
          .delete()
          .eq('hour', hourValue);
        setTimeout(showStatus, 1000);
        overlayPersist = false;
        lastOverlayTaskHour = null;
        lastOverlayTaskShown = null;
        document.getElementById("mainTitle").innerHTML = "Outpost IX Airlock<br>Status Panel";
        document.getElementById("cluePanel").style.display = "none";
        document.getElementById("clueList").innerHTML = "";
        document.getElementById("hullPanel").style.display = "none";
        document.getElementById("hullList").innerHTML = "";
        document.getElementById("hullFinal").innerHTML = "";
      } catch (err) {
        console.error("Reset JS Error:", err);
      }
    }
  </script>
</body>
</html>
