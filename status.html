<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Outpost Status Panel</title>
  <link href="https://fonts.googleapis.com/css?family=Orbitron&display=swap" rel="stylesheet">
  <style>
    body { background: #101130; color: #bfefff; font-family: 'Orbitron', Arial, sans-serif; text-align: center;}
    h1 { font-size: 2.1em; color: #51cfff; margin-top: 28px; margin-bottom: 44px; text-shadow: 0 2px 18px #1388d8;}
    /* ...copied your segment and bar styles... */
    /* Overlay styles for Access Granted */
    .overlay-wrap {
      display: none;
      position: fixed;
      left: 0; top: 0; width: 100%; height: 100%;
      background: #0d203bde;
      z-index: 1000;
      justify-content: center; align-items: center;
    }
    .overlay-content {
      padding: 60px 40px;
      background: #244b7c;
      border-radius: 22px;
      color: #cbefff;
      font-size: 2.3em;
      font-weight: bold;
      box-shadow: 0 0 90px #16a098, 0 0 16px #233357;
      text-shadow: 0 6px 30px #17b7fd77;
      animation: accessFade 1.2s;
    }
    @keyframes accessFade {
      0%   { opacity: 0;}
      100% { opacity:1;}
    }
    .clue-text { font-size: 1.04em; color: #aefcca; margin-top: 24px; font-weight:bold;}
    .loc-final { font-size: 1.5em; color: #7cdcf8; margin-top: 34px; font-weight: bold;}
  </style>
</head>
<body>
  <h1 id="mainTitle">Outpost IX Airlock<br>Status Panel</h1>
  <div id="hourbar" class="hourbar red">Hour: (none selected)</div>
  <div class="status-panel" id="statusPanel">
    <!-- Segments w/ clues will be injected -->
  </div>
  <div id="locFinal" class="loc-final"></div>
  <button class="reset-btn" onclick="resetStatus()">Reset Status</button>

  <div class="overlay-wrap" id="overlayAccess">
    <div class="overlay-content" id="accessText"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Group clue MASTER LIST -- SciFi flavor, editable!
    const CLUES = [
      "Aft Section",      // Group 1
      "Starboard Side",   // Group 2
      "Lower Decks",      // Group 3
      "Deck 3",           // Group 4
      "Compartment #17"   // Group 5
    ];
    const GROUP_LABELS = ["Group 1", "Group 2", "Group 3", "Group 4", "Group 5"];

    let previousColor = "", hourValue = localStorage.getItem("classHour") || "";
    const supabaseUrl = 'https://khazeoycsjdqnmwodncw.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoYXplb3ljc2pkcW5td29kbmN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5MDMwOTMsImV4cCI6MjA3ODQ3OTA5M30.h-WabaGcQZ968sO2ImetccUaRihRFmO2mUKCdPiAbEI';
    const client = supabase.createClient(supabaseUrl, supabaseKey);

    // Current task being displayed for this panel (for cycling from task 1 to 2)
    let currentTask = "task1";
    let cluesShown = [];

    function injectSegments(statuses) {
      // Clear and redraw the panel
      const panel = document.getElementById("statusPanel");
      panel.innerHTML = "";
      cluesShown = [];
      for (let i = 1; i <= 5; i++) {
        const seg = document.createElement('div');
        seg.className = "segment";
        seg.id = "stat" + i;
        let done = statuses[`group${i}`]?.done;
        let clue = done ? `<div class="clue-text">${CLUES[i-1]}</div>` : "";
        seg.classList.toggle('done', !!done);
        seg.innerHTML = `${GROUP_LABELS[i-1]}${done ? "<br>✓" : ""}${clue}`;
        panel.appendChild(seg);
        if (done) cluesShown.push(CLUES[i-1]);
      }
      // Compose final location string if all clues present
      document.getElementById('locFinal').innerText = 
        cluesShown.length === 5 ? 
        `LOCATION: ${cluesShown.join(" – ")}` : "";
    }

    async function showStatus() {
      // Query group status for this hour/task
      const { data, error } = await client
        .from('airlock_status')
        .select('group,done,task')
        .eq('hour', hourValue)
        .eq('task', currentTask);

      // Create lookup: group => done
      let statuses = {}, doneCount = 0;
      for (let i = 1; i <= 5; i++) {
        const groupName = "group" + i;
        statuses[groupName] = { done: false };
        const groupData = data?.find(d => d.group === groupName);
        if (groupData && groupData.done) {
          statuses[groupName].done = true;
          doneCount++;
        }
      }

      injectSegments(statuses);

      // Bar color and info
      const bar = document.getElementById("hourbar");
      let colorClass = "red";
      if (doneCount >= 5) colorClass = "green";
      else if (doneCount >= 3) colorClass = "yellow";
      else if (doneCount >= 1) colorClass = "orange";
      bar.classList.remove("red", "orange", "yellow", "green", "pulse");
      bar.classList.add(colorClass);
      bar.innerHTML = `Hour: ${hourValue ? hourValue : "(none selected)"}
        <span style="font-weight:normal;font-size:0.98em;margin-left:12px;">(${doneCount}/5 groups complete)</span>`;

      if (previousColor !== colorClass) {
        bar.classList.add("pulse");
        setTimeout(() => bar.classList.remove("pulse"), 2800);
        previousColor = colorClass;
      }

      // All done logic
      if (doneCount === 5) {
        if (currentTask === "task1") {
          // Show Access overlay
          let overlay = document.getElementById("overlayAccess");
          let accessText = document.getElementById("accessText");
          overlay.style.display = "flex";
          accessText.innerHTML = "Access Granted!<br>All airlock security tasks complete.<br><br>Station clues revealed:";
          for (let i = 0; i < CLUES.length; i++) {
            accessText.innerHTML += `<br><span style="font-size:0.9em;color:#7ffdca;">${GROUP_LABELS[i]}: ${CLUES[i]}</span>`;
          }
          // Show location at the bottom
          accessText.innerHTML += `<br><br><span style="font-size:1.07em;color:#7cdcf8;font-weight:bold;">LOCATION: ${CLUES.join(" – ")}</span>`;
          // Fade overlay after 10sec & switch to next task
          setTimeout(() => {
            overlay.style.display = "none";
            // Transition to "Task 2" tracking
            switchToTask2();
          }, 10000);
        } else if (currentTask === "task2") {
          // All done with task 2
          let overlay = document.getElementById("overlayAccess");
          let accessText = document.getElementById("accessText");
          overlay.style.display = "flex";
          accessText.innerHTML = `<span style="font-size:1.07em;color:#f7fc7e;">Structural Lockdown Cleared!<br>All damage containment tasks complete.<br><br>Outpost secured.</span>`;
          setTimeout(() => overlay.style.display = "none", 8000);
        }
      } else {
        // Hide overlay if re-loading before all groups done
        document.getElementById("overlayAccess").style.display = "none";
      }
    }

    function switchToTask2() {
      currentTask = "task2";
      cluesShown = [];
      document.getElementById("mainTitle").innerHTML = "Outpost IX Damage Panel<br>Task 2";
      document.getElementById("hourbar").classList.remove("pulse", "green", "orange", "yellow", "red");
      // Optional: Reset locFinal
      document.getElementById("locFinal").innerText = "";
      showStatus();
    }

    setInterval(showStatus, 1500);
    showStatus();

    setInterval(() => {
      document.querySelectorAll('.segment.done').forEach(el => {
        el.classList.remove('pulse');
        void el.offsetWidth;
        el.classList.add('pulse');
        setTimeout(() => el.classList.remove('pulse'), 2000);
      });
    }, 5000);

    async function resetStatus() {
      try {
        await client.from('airlock_status').delete().eq('hour', hourValue);
        setTimeout(showStatus, 1000);
        currentTask = "task1";
        document.getElementById("mainTitle").innerHTML = "Outpost IX Airlock<br>Status Panel";
        document.getElementById("locFinal").innerText = "";
      } catch (err) {
        console.error("Reset JS Error:", err);
      }
    }
  </script>
</body>
</html>
