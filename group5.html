<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Group 5 – Equation Builder</title>
  <link href="https://fonts.googleapis.com/css?family=Orbitron&display=swap" rel="stylesheet">
  <style>
    body { background:#1a191b; color:#fff; font-family:'Orbitron', Arial, sans-serif; }
    .container { max-width:650px; margin:40px auto; background:#233140ee; border-radius:10px; padding:28px 28px 38px 28px; box-shadow:0 0 12px #252545; }
    .heading { font-size:1.7em; color:#b2e2ff; margin-bottom:20px; text-align:center; }
    .overlay { background:rgba(16, 16, 24, 0.89); padding:19px 24px; border-radius:8px; margin:0 auto; max-width:370px; box-shadow:0 2px 8px #18181844;}
    input, button { font-size:1em; margin-top:8px; }
    input { padding:8px; background:#232a39; color:#fff; border:1px solid #64aafc; border-radius:5px; width:88%; }
    button { margin-top:14px; padding:6px 22px; background:#5577ff; color:#fff; border:none; border-radius:7px; cursor:pointer; }
    button:hover { background:#3355cc; }
    .backlink { display:block; background:#353979; color:#fff; border-radius:8px; padding:9px; text-align:center; text-decoration:none; margin-top:32px; font-weight:700;}
    .backlink:hover {background:#2c334b;}
    .math { font-family:'Consolas', monospace; color:#aaf; }
    .feedback { color:#6effc1; margin-top:14px; font-weight:bold; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <div class="heading">Group 5: Equation Builder</div>
    <div class="overlay">
      <div>
        <strong>Clue:</strong> Find the equation of the line (in <span class="math">y=mx+b</span> form) that passes through both points:
      </div>
      <ul>
        <li>(2, 5)</li>
        <li>(4, 9)</li>
      </ul>
      <input type="text" id="ans" placeholder="e.g. y=2x+1">
      <button onclick="checkAnswer()">Unlock</button>
      <div class="feedback" id="feedback"></div>
    </div>
    <a href="airlock.html" class="backlink">← Back to Control Panel</a>
  </div>
  <script>
    // Supabase setup
    const supabaseUrl = 'https://your-project-url.supabase.co';
    const supabaseKey = 'your-public-anon-key';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    window.onload = async function() {
      let { data } = await supabase.from('airlock_status').select('done').eq('group', 'group5').single();
      if (data && data.done) {
        document.getElementById("feedback").textContent = "Already unlocked! Return to the Control Panel.";
      }
    }

    async function checkAnswer() {
      var entry = document.getElementById("ans").value.replace(/\s/g,"").toLowerCase();
      // Find line through (2,5) and (4,9)
      // slope: m = (9-5)/(4-2) = 2; b: 5=2*2+b -> b=1
      if (entry === "y=2x+1") {
        document.getElementById("feedback").textContent = "Correct! System restored. Return to the Control Panel.";
        await supabase.from('airlock_status').upsert([{ group: 'group5', done: true }]);
      } else {
        document.getElementById("feedback").textContent = "Try again.";
      }
    }
  </script>
</body>
</html>
