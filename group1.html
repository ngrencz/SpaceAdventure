<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Group 1 – Dynamic Mission Challenge</title>
  <link href="https://fonts.googleapis.com/css?family=Orbitron&display=swap" rel="stylesheet">
  <style>
    body { background:#1a191b; color:#fff; font-family:'Orbitron', Arial, sans-serif; }
    .container { max-width:650px; margin:40px auto; background:#233140ee; border-radius:10px; padding:28px 28px 38px 28px; box-shadow:0 0 12px #252545; }
    .heading { font-size:1.7em; color:#b2e2ff; margin-bottom:20px; text-align:center; }
    .overlay { background:rgba(16, 16, 24, 0.89); padding:19px 24px; border-radius:8px; margin:0 auto; max-width:370px; box-shadow:0 2px 8px #18181844;}
    input[type="text"] { padding:8px; background:#232a39; color:#fff; border:1px solid #64aafc; border-radius:5px; width:80px; font-size:1em; text-align: center; margin-right: 6px;}
    #unlockBtn { margin-top:14px; padding:6px 22px; background:#5577ff; color:#fff; border:none; border-radius:7px; cursor:pointer; font-size:1em;}
    #unlockBtn:hover { background:#3355cc; }
    .math { font-family:'Consolas', monospace; color:#aaf; }
    .feedback { color:#6effc1; margin-top:14px; font-weight:bold; }
    .backlink { display:block; background:#353979; color:#fff; border-radius:8px; padding:9px; text-align:center; text-decoration:none; margin-top:32px; font-weight:700;}
    .backlink:hover {background:#2c334b;}
    ul { padding-left: 18px;}
  </style>
</head>
<body>
  <div class="container">
    <div class="heading"></div>
    <div class="overlay">
      <div class="clue"></div>
      <ul></ul>
      <button id="unlockBtn">Unlock</button>
      <div class="feedback" id="feedback"></div>
    </div>
    <a href="index.html" class="backlink">← Back to Control Panel</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Get selected hour and task
    const hourValue = localStorage.getItem("classHour") || "";
    const taskId = localStorage.getItem("currentTask") || "task1";
    const supabaseUrl = 'https://khazeoycsjdqnmwodncw.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoYXplb3ljc2pkcW5td29kbmN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5MDMwOTMsImV4cCI6MjA3ODQ3OTA5M30.h-WabaGcQZ968sO2ImetccUaRihRFmO2mUKCdPiAbEI';
    const client = supabase.createClient(supabaseUrl, supabaseKey);

    // Define problems for each task
    const TASKS = {
      task1: {
        heading: "Group 1: Slope Sequence Override",
        clue: 'Solve for the slope (<span class="math">m</span>) of each equation.<br>Type each answer in its own box.',
        equations: [
          { eq: "2y = 4x + 4", ans: "2" },
          { eq: "y + 3x = 7", ans: "-3" },
          { eq: "y - x = - 5", ans: "1" },
          { eq: "y + 4x = 6x - 7", ans: "2" },
          { eq: "2y + 7x = 2x + y - 10", ans: "-5" }
        ]
      },
      task2: {
        heading: "Group 1: X-Term Isolation Lab",
        clue: 'Solve for <span class="math">x</span> for each equation. <br> Some answers may include y. Type each answer in its own box. Use fractions if needed.<br><br><span style="font-size:0.93em;color:#7fc6fe">Example formatting: x = 3, x = y/2, x = (y+5)/7</span>',
        equations: [
          // Numbers only (no y in answer)
          { eq: "2x = 12", ans: "6" },                 // x = 6
          { eq: "5x - 4 = 16", ans: "4" },             // x = 4
          { eq: "3x + 9 = 0", ans: "-3" },             // x = -3
          // With y
          { eq: "7x = y + 14", ans: "(y+14)/7" },      // x = (y+14)/7
          { eq: "2x - 3 = 4y", ans: "(4y+3)/2" }       // x = (4y+3)/2
        ]
      }
      // Add more tasks as needed
    };

    // Render dynamic content based on current task
    function renderTaskContent() {
      const task = TASKS[taskId] || TASKS["task1"]; // fallback
      document.querySelector('.heading').textContent = task.heading;
      document.querySelector('.clue').innerHTML = '<strong>Clue:</strong> ' + task.clue;

      const ul = document.querySelector('ul');
      ul.innerHTML = "";
      task.equations.forEach((e, i) => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="math">${e.eq}</span> &rarr; <input type="text" id="ans${i+1}" maxlength="18">`;
        ul.appendChild(li);
      });
    }

    // Check if already completed for this group/task/hour
    async function checkCompleted() {
      try {
        let { data, error } = await client
          .from('airlock_status')
          .select('done')
          .eq('group', 'group1')
          .eq('hour', hourValue)
          .eq('task', taskId)
          .maybeSingle();
        if (data && data.done) {
          document.getElementById("feedback").textContent = "Already unlocked! Return to the Control Panel.";
          document.getElementById("unlockBtn").disabled = true; // Prevent re-unlocking
          // Optionally: Grey-out or style inputs as "complete"
        } else {
          document.getElementById("feedback").textContent = "";
          document.getElementById("unlockBtn").disabled = false;
        }
        if (error && error.code !== "PGRST116") {
          document.getElementById("feedback").textContent = "Supabase error (on load): " + error.message;
          console.error("Supabase error (on load):", error);
        }
      } catch (err) {
        document.getElementById("feedback").textContent = "JS Error (on load): " + err;
        console.error("JS Error (on load):", err);
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      renderTaskContent();
      checkCompleted();
    });

    document.getElementById("unlockBtn").onclick = async function() {
      const task = TASKS[taskId] || TASKS["task1"];
      let correct = true;
      task.equations.forEach((e, i) => {
        const answer = document.getElementById("ans"+(i+1)).value.trim().replace(/\s+/g, '');
        const target = e.ans.replace(/\s+/g, '');
        if (answer.toLowerCase() !== target.toLowerCase()) correct = false;
      });

      if (correct) {
        document.getElementById("feedback").textContent = "Correct! Segment unlocked. Return to the Control Panel.";
        document.getElementById("unlockBtn").disabled = true;
        try {
          const { error, data } = await client
            .from('airlock_status')
            .upsert([{ group: 'group1', task: taskId, done: true, hour: hourValue }]);
          if (error) {
            document.getElementById("feedback").textContent += "\nError: " + error.message;
            console.error("Supabase error:", error);
          } else {
            console.log("Supabase upsert OK", data);
          }
        } catch (err) {
          document.getElementById("feedback").textContent += "\nJS Error: " + err;
          console.error("JS Error:", err);
        }
      } else {
        document.getElementById("feedback").textContent = "Try again.";
      }
    };
  </script>
</body>
</html>
