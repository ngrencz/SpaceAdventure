<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brute Force Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #050505;
            color: #39ff14; /* Neon green */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(57, 255, 20, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .terminal-box {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #39ff14;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2), inset 0 0 15px rgba(57, 255, 20, 0.1);
        }

        .glow-text {
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
        }

        .display-slot {
            border-bottom: 3px solid #39ff14;
            transition: all 0.2s;
        }

        .keypad-btn {
            background: transparent;
            border: 1px solid rgba(57, 255, 20, 0.4);
            color: #39ff14;
            transition: all 0.1s ease;
        }
        
        .keypad-btn:hover {
            background: rgba(57, 255, 20, 0.15);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
        }

        .keypad-btn:active {
            background: #39ff14;
            color: #000;
        }

        .btn-action {
            border-color: rgba(255, 165, 0, 0.6);
            color: orange;
        }
        .btn-action:hover {
            background: rgba(255, 165, 0, 0.15);
            box-shadow: 0 0 10px rgba(255, 165, 0, 0.4);
        }
        .btn-action:active { background: orange; color: #000; }

        .btn-submit {
            border-color: rgba(57, 255, 20, 0.8);
            font-weight: bold;
        }

        /* Error state animations */
        @keyframes flash-error {
            0%, 100% { 
                border-color: #39ff14; 
                box-shadow: 0 0 15px rgba(57, 255, 20, 0.2); 
            }
            20%, 60% { 
                border-color: #ff003c; 
                box-shadow: 0 0 30px rgba(255, 0, 60, 0.8); 
            }
        }
        
        @keyframes text-error {
            0%, 100% { color: #39ff14; text-shadow: 0 0 8px rgba(57, 255, 20, 0.6); }
            20%, 60% { color: #ff003c; text-shadow: 0 0 15px rgba(255, 0, 60, 0.8); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .error-state {
            animation: flash-error 0.6s ease-in-out, shake 0.4s ease-in-out;
        }

        .error-text {
            animation: text-error 0.6s ease-in-out;
        }

        /* Success state */
        .success-state {
            border-color: #00ffea;
            box-shadow: 0 0 30px rgba(0, 255, 234, 0.8);
            color: #00ffea;
            text-shadow: 0 0 15px rgba(0, 255, 234, 0.8);
        }
        
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 50;
            position: absolute;
            pointer-events: none;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(57,255,20,0.1) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { top: -100px; }
            100% { top: 100%; }
        }
    </style>
</head>
<body class="p-4 relative">

    <div class="scanline"></div>

    <div id="main-container" class="terminal-box max-w-lg w-full p-6 md:p-8 rounded-lg relative z-10">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-bold glow-text uppercase tracking-widest">Brute Force Sim</h1>
            <p class="text-sm opacity-70 mt-1">SYSTEM LOCKED. 10,000 POSSIBILITIES.</p>
        </div>

        <!-- System Stats -->
        <div class="border border-[#39ff14]/30 p-4 mb-8 bg-[#39ff14]/5 rounded text-sm md:text-base">
            <div class="flex justify-between mb-2 border-b border-[#39ff14]/20 pb-2">
                <span class="opacity-80">TARGET:</span>
                <span>[ENCRYPTED]</span>
            </div>
            <div class="flex justify-between mb-2 border-b border-[#39ff14]/20 pb-2">
                <span class="opacity-80">TOTAL COMBINATIONS:</span>
                <span>10,000</span>
            </div>
            <div class="flex justify-between items-center text-lg mt-3">
                <span class="opacity-80">ATTEMPTS MADE:</span>
                <span id="attempt-count" class="text-2xl font-bold glow-text">0</span>
            </div>
        </div>

        <!-- PIN Display -->
        <div class="mb-8 relative">
            <div id="status-msg" class="absolute -top-6 left-0 w-full text-center text-sm uppercase tracking-widest">
                ENTER 4-DIGIT PIN
            </div>
            <div id="display-container" class="flex justify-center gap-4 md:gap-6 bg-black p-6 border border-[#39ff14]/50 rounded">
                <div class="display-slot w-12 h-16 flex items-center justify-center text-4xl glow-text">_</div>
                <div class="display-slot w-12 h-16 flex items-center justify-center text-4xl glow-text">_</div>
                <div class="display-slot w-12 h-16 flex items-center justify-center text-4xl glow-text">_</div>
                <div class="display-slot w-12 h-16 flex items-center justify-center text-4xl glow-text">_</div>
            </div>
        </div>

        <!-- Keypad -->
        <div class="grid grid-cols-3 gap-3 md:gap-4 max-w-xs mx-auto">
            <button onclick="handleKey('1')" class="keypad-btn py-4 text-2xl rounded">1</button>
            <button onclick="handleKey('2')" class="keypad-btn py-4 text-2xl rounded">2</button>
            <button onclick="handleKey('3')" class="keypad-btn py-4 text-2xl rounded">3</button>
            <button onclick="handleKey('4')" class="keypad-btn py-4 text-2xl rounded">4</button>
            <button onclick="handleKey('5')" class="keypad-btn py-4 text-2xl rounded">5</button>
            <button onclick="handleKey('6')" class="keypad-btn py-4 text-2xl rounded">6</button>
            <button onclick="handleKey('7')" class="keypad-btn py-4 text-2xl rounded">7</button>
            <button onclick="handleKey('8')" class="keypad-btn py-4 text-2xl rounded">8</button>
            <button onclick="handleKey('9')" class="keypad-btn py-4 text-2xl rounded">9</button>
            <button onclick="handleClear()" class="keypad-btn btn-action py-4 text-sm rounded uppercase tracking-wider">CLR</button>
            <button onclick="handleKey('0')" class="keypad-btn py-4 text-2xl rounded">0</button>
            <button onclick="handleSubmit()" class="keypad-btn btn-submit py-4 text-sm rounded uppercase tracking-wider bg-[#39ff14]/10 hover:bg-[#39ff14]/30">ENT</button>
        </div>
        
    </div>

    <script>
        // Game State
        let secretCode = "";
        let currentGuess = "";
        let attempts = 0;
        let isLocked = false;
        
        // DOM Elements
        const displaySlots = document.querySelectorAll('.display-slot');
        const attemptCountEl = document.getElementById('attempt-count');
        const statusMsg = document.getElementById('status-msg');
        const mainContainer = document.getElementById('main-container');
        const displayContainer = document.getElementById('display-container');

        // Initialize system
        function initSystem() {
            // Generate random 4 digit code with leading zeros (e.g., "0042")
            secretCode = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
            currentGuess = "";
            attempts = 0;
            isLocked = false;
            updateDisplay();
            updateStats();
            statusMsg.textContent = "ENTER 4-DIGIT PIN";
            statusMsg.className = "absolute -top-6 left-0 w-full text-center text-sm uppercase tracking-widest text-[#39ff14]";
            mainContainer.classList.remove('success-state');
            displayContainer.classList.remove('success-state');
            
            console.log("SIMULATOR INITIATED. TARGET CODE:", secretCode); // Debugging / Cheat
        }

        // Handle numeric input
        function handleKey(num) {
            if (isLocked) return;
            
            // Clear previous error messages automatically on new input
            if (statusMsg.textContent === "INCORRECT!") {
                statusMsg.textContent = "ENTER 4-DIGIT PIN";
                statusMsg.classList.remove('text-[#ff003c]');
            }

            if (currentGuess.length < 4) {
                currentGuess += num;
                updateDisplay();
            }
        }

        // Handle clear
        function handleClear() {
            if (isLocked) return;
            currentGuess = "";
            updateDisplay();
            statusMsg.textContent = "ENTER 4-DIGIT PIN";
            statusMsg.classList.remove('text-[#ff003c]');
        }

        // Update the display slots based on current guess
        function updateDisplay() {
            displaySlots.forEach((slot, index) => {
                if (index < currentGuess.length) {
                    slot.textContent = currentGuess[index];
                } else {
                    slot.textContent = "_";
                }
            });
        }

        // Update attempt counter
        function updateStats() {
            // Format number with commas for readability
            attemptCountEl.textContent = attempts.toLocaleString();
        }

        // Handle submission
        function handleSubmit() {
            if (isLocked || currentGuess.length !== 4) return;

            attempts++;
            updateStats();

            if (currentGuess === secretCode) {
                handleSuccess();
            } else {
                handleFailure();
            }
        }

        // Incorrect Guess Routine
        function handleFailure() {
            statusMsg.textContent = "INCORRECT!";
            statusMsg.className = "absolute -top-6 left-0 w-full text-center text-sm uppercase tracking-widest font-bold text-[#ff003c]";
            
            // Trigger animations
            mainContainer.classList.remove('error-state');
            displayContainer.classList.remove('error-text');
            
            // Trigger reflow to restart animation
            void mainContainer.offsetWidth; 
            
            mainContainer.classList.add('error-state');
            displayContainer.classList.add('error-text');
            
            // Clear guess automatically after failure
            currentGuess = "";
            updateDisplay();
        }

        // Correct Guess Routine
        function handleSuccess() {
            isLocked = true;
            statusMsg.textContent = "CORRECT! ACCESS GRANTED.";
            statusMsg.className = "absolute -top-6 left-0 w-full text-center text-sm uppercase tracking-widest font-bold text-[#00ffea]";
            
            mainContainer.classList.add('success-state');
            displayContainer.classList.add('success-state');
            
            // Change slot colors
            displaySlots.forEach(slot => {
                slot.style.color = "#00ffea";
                slot.style.borderColor = "#00ffea";
            });
        }

        // Keyboard support
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                handleKey(e.key);
            } else if (e.key === 'Backspace' || e.key === 'Delete') {
                handleClear();
            } else if (e.key === 'Enter') {
                handleSubmit();
            }
        });

        // Initialize on load
        window.onload = initSystem;
        
    </script>
</body>
</html>
