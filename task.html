<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Outpost IX Mission Task</title>
  <link href="https://fonts.googleapis.com/css?family=Orbitron&display=swap" rel="stylesheet">
  <style>
    body { background: #0e1834; color: #cbe7ff; font-family: 'Orbitron', Arial, sans-serif; margin: 0;}
    .container { max-width:680px; margin:56px auto 0 auto; background:#203266dd; border-radius:14px; padding:38px 38px 48px 38px; box-shadow:0 0 22px #273b83; }
    h1 { color: #7fc6ff; font-size:2.25em; margin-bottom:16px;}
    .story { color:#b4ffe8; font-size:1.18em; margin-bottom:24px;}
    .instructions { color:#50ee9e; font-size:1.12em; margin-bottom: 26px;}
    .links { margin-top: 12px; }
    .glink {
      display:block; background:#345ba9; color:#fff; border-radius:8px; font-size:1.08em; padding:15px; margin-bottom: 17px;
      text-decoration:none; text-align:center; font-weight:bold; transition: background 0.2s;
      box-shadow: 0 4px 16px #373b6e22; cursor: pointer;
    }
    .glink:hover { background:#29ad77; }
    .return { display: block; background:#535b89; margin-top:42px; color:#fff; border-radius:8px; padding:11px;
      text-align:center; text-decoration:none; font-weight:700; transition: background 0.17s;}
    .return:hover { background: #29334b; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="taskTitle"></h1>
    <div class="story" id="taskStory"></div>
    <div class="instructions" id="taskInst"></div>
    <div class="links" id="groupLinks"></div>
    <a href="index.html" class="return">← Return to Mission Briefing</a>
  </div>
  <script>
    // Get currentTask from localStorage (safe default to 'task1')
    const taskId = localStorage.getItem('currentTask') || 'task1';

    // Per-task content definitions
    const TASKS = {
      task1: {
        title: "Task 1 – Enter the Airlock",
        story: `
          The airlock seals are protected by five math locks. Each group's puzzle represents one vital subsystem.<br><br>
          The outpost's eccentric designer, Dr. Pascal "Numbers" Euler, believed only mathematicians should access life support.<br><br>
          Solve your group's challenge to unlock the section and grant entry!
        `,
        instructions: "Select your group below to solve the Task 1 challenge.",
        groupLinks: [
          { href: "group1.html", text: "Group 1: Slope Solver", task: "task1" },
          { href: "group2.html", text: "Group 2: Y-Intercepts", task: "task1" },
          { href: "group3.html", text: "Group 3: Slope-Intercept Cipher", task: "task1" },
          { href: "group4.html", text: "Group 4: Linear Equations", task: "task1" },
          { href: "group5.html", text: "Group 5: Equation Builder", task: "task1" }
        ]
      },
      task2: {
        title: "Task 2 – Find Damaged Compartment",
        story: `
          System damage is spreading. Each group faces new algebraic encryption, concealing clues to pinpoint the affected sectors.<br><br>
          Solve your equation set and share findings—the panel will reveal which section requires repairs.<br><br>
          Current clues indicate affected areas:<br>
          <ul style="color:#b4ffdc;font-size:1em;line-height:1.4;">
            <li>Group 1: Aft Section</li>
            <li>Group 2: Starboard Side</li>
            <li>Group 3: Lower Decks</li>
            <li>Group 4: Decks 3–17</li>
            <li>Group 5: Compartments #17–48</li>
          </ul>
        `,
        instructions: "Select your group and crack the Task 2 encryption to reveal your area’s status.",
        groupLinks: [
          { href: "group1.html", text: "Group 1: X-Term Override", task: "task2" },
          { href: "group2.html", text: "Group 2: Y-Term Isolation Lab", task: "task2" },
          { href: "group3.html", text: "Group 3: Equation Solution Counter", task: "task2" },
          { href: "group4.html", text: "Group 4: Slope Tagger", task: "task2" },
          { href: "group5.html", text: "Group 5: Y-Intercept Identifier", task: "task2" }
        ]
      },
      task3: {
        title: "Task 3 – Repair Module Sequencing",
        story: `
          You have identified the locations of damage:<br>
          <ul style="color:#b4ffdc; font-size:1em; line-height:1.4;">
            <li><strong>Group 1:</strong> Aft Section</li>
            <li><strong>Group 2:</strong> Starboard Side</li>
            <li><strong>Group 3:</strong> Lower Decks</li>
            <li><strong>Group 4:</strong> Decks 3–17</li>
            <li><strong>Group 5:</strong> Compartments #17–48</li>
          </ul>
          <br>
          The auto-repair modules are ready to restore these sections, but one last mathematical command sequence is required.<br><br>
          Each group must solve a final set of systems equations to synchronize repairs across their sector.<br><br>
          <strong>The outpost cannot recover unless all five teams complete their module challenge!</strong>
          <br>Work together, share insights, and coordinate the repair. Complete success will restore hull integrity and improve the survival odds for Outpost IX.<br>
          Once the hull is repaired, you'll embark on further critical repairs—oxygen, power, and beyond...
        `,
        instructions: "Select your group below and restore your assigned area by solving its final system challenge.",
        groupLinks: [
          { href: "group1.html", text: "Group 1: Repair – Aft Section", task: "task3" },
          { href: "group2.html", text: "Group 2: Repair – Starboard Side", task: "task3" },
          { href: "group3.html", text: "Group 3: Repair – Lower Decks", task: "task3" },
          { href: "group4.html", text: "Group 4: Repair – Decks 3–17", task: "task3" },
          { href: "group5.html", text: "Group 5: Repair – Compartments #17–48", task: "task3" }
        ]
      }
    };

    // Select data for this taskId
    const task = TASKS[taskId] || TASKS['task1'];

    // Populate template
    document.getElementById('taskTitle').textContent = task.title;
    document.getElementById('taskStory').innerHTML = task.story;
    document.getElementById('taskInst').textContent = task.instructions;

    // Group links
    const linksDiv = document.getElementById('groupLinks');
    task.groupLinks.forEach(link => {
      const a = document.createElement('a');
      a.className = 'glink';
      a.href = link.href;
      a.textContent = link.text;
      // ON CLICK: set both currentGroup and currentTask safely
      a.onclick = function(e) {
        e.preventDefault();
        localStorage.setItem('currentGroup', link.text.split(':')[0].toLowerCase().replace(' ', ''));
        localStorage.setItem('currentTask', link.task);
        window.location.href = link.href;
      };
      linksDiv.appendChild(a);
    });
  </script>
</body>
</html>
